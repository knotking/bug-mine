<!doctype html>
<meta charset="utf-8">
<title>BugMine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  color-scheme:light;
  --bg:#fbfbfd; --panel:#fff; --fg:#16161a; --dim:#6b6b76; --faint:#9a9aa4;
  --line:#e6e6ec; --accent:#4338ca; --accent-fg:#fff;
  --accent-soft:#eef0fe; --accent-dim:#6366f1; --glow:rgba(67,56,202,.18);
  --raise:0 1px 2px rgba(16,16,26,.05), 0 4px 16px rgba(16,16,26,.05);
  --raise-lg:0 2px 4px rgba(16,16,26,.06), 0 12px 40px rgba(16,16,26,.10);
  --grid:rgba(16,16,26,.045);
  --breaking:#8a3d00; --breaking-bg:#fdf1e7;
  --security:#9b1c2b; --security-bg:#fdeef0;
  --deprecation:#5b4b8a; --deprecation-bg:#f2effa;
  --functional:#1f5fbf; --functional-bg:#ecf2fc;
  --ok:#1d6b46; --ok-bg:#eaf6ef; --warn:#8a5b00; --warn-bg:#fdf5e3;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f1013; --panel:#17181d; --fg:#e9e9ee; --dim:#9c9caa; --faint:#6e6e7c;
  --line:#26272e; --accent:#818cf8; --accent-fg:#0f1013;
  --accent-soft:#1b1c2e; --accent-dim:#a5b4fc; --glow:rgba(129,140,248,.22);
  --raise:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --raise-lg:0 2px 4px rgba(0,0,0,.45), 0 12px 40px rgba(0,0,0,.45);
  --grid:rgba(255,255,255,.04);
  --breaking:#e0a06a; --breaking-bg:#2a1e14;
  --security:#e88b93; --security-bg:#2a1618;
  --deprecation:#b3a3e0; --deprecation-bg:#1e1a2a;
  --functional:#7fb0f5; --functional-bg:#141c2a;
  --ok:#6fc79b; --ok-bg:#12241a; --warn:#dcae5c; --warn-bg:#251d0e;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1013; --panel:#17181d; --fg:#e9e9ee; --dim:#9c9caa; --faint:#6e6e7c;
  --line:#26272e; --accent:#818cf8; --accent-fg:#0f1013;
  --accent-soft:#1b1c2e; --accent-dim:#a5b4fc; --glow:rgba(129,140,248,.22);
  --raise:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --raise-lg:0 2px 4px rgba(0,0,0,.45), 0 12px 40px rgba(0,0,0,.45);
  --grid:rgba(255,255,255,.04);
  --breaking:#e0a06a; --breaking-bg:#2a1e14;
  --security:#e88b93; --security-bg:#2a1618;
  --deprecation:#b3a3e0; --deprecation-bg:#1e1a2a;
  --functional:#7fb0f5; --functional-bg:#141c2a;
  --ok:#6fc79b; --ok-bg:#12241a; --warn:#dcae5c; --warn-bg:#251d0e;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,.mono{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- sign in ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;
  overflow:hidden}
/* Two soft colour fields behind the card. Cheap — no images, no libraries — and it gives the
   page a sense of depth that a flat panel on a flat background never has. */
.auth::before,.auth::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);
  pointer-events:none;z-index:0}
.auth::before{width:520px;height:520px;top:-160px;left:-120px;
  background:radial-gradient(circle,var(--glow),transparent 68%)}
.auth::after{width:460px;height:460px;bottom:-180px;right:-140px;
  background:radial-gradient(circle,var(--breaking-bg),transparent 70%);opacity:.75}
/* A faint grid, masked so it fades out before the edges rather than stopping abruptly. */
.auth-grid{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 72%);
  mask-image:radial-gradient(ellipse at center,#000 20%,transparent 72%)}
.auth-card{width:100%;max-width:404px;position:relative;z-index:1;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:30px 28px;box-shadow:var(--raise-lg)}
@media(prefers-reduced-motion:no-preference){
  .auth-card{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mark svg{flex:none}
.mark h1{font-size:22px;letter-spacing:-.02em;font-weight:650}
.tagline{color:var(--dim);font-size:14px;margin-bottom:26px;line-height:1.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:.03em;text-transform:uppercase;margin-bottom:5px}
input,select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--fg)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.btn{width:100%;font:inherit;font-weight:550;padding:10px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:450}
.btn{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.06);box-shadow:0 4px 14px var(--glow)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default;filter:none;box-shadow:none}
input,select,textarea{transition:border-color .12s ease,box-shadow .12s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--glow)}
.note{font-size:13px;color:var(--faint);margin-top:14px;line-height:1.5}
.error{color:var(--security);font-size:13px;margin-top:10px}

/* ---------- shell ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(8px)}
header .mark svg{color:var(--accent)}
.who{padding:3px 9px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent-dim);font-weight:550}
header .mark h1{font-size:16px}
header .spacer{margin-left:auto}
header .who{font-size:13px;color:var(--dim)}
nav{display:flex;gap:2px;padding:8px 20px 0;border-bottom:1px solid var(--line);
  background:var(--panel);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;
  color:var(--dim);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button{transition:color .12s ease,border-color .12s ease}
nav button:hover{color:var(--fg)}
nav button[aria-current=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:22px 20px;max-width:1060px}
h2{font-size:15px;font-weight:600;margin-bottom:3px}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;
  position:relative;overflow:hidden;box-shadow:var(--raise);
  transition:transform .14s ease,box-shadow .14s ease}
.stat:hover{transform:translateY(-2px);box-shadow:var(--raise-lg)}
/* A hairline of accent across the top: enough to make a number feel deliberate rather than
   dropped into a box. */
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-dim),transparent)}
.stat .n{font-variant-numeric:tabular-nums}
.stat .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:12px;color:var(--dim);margin-top:3px}

/* ---------- lists ---------- */
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px 14px 17px;margin-bottom:10px;position:relative;
  transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease}
.row:hover{border-color:var(--accent);box-shadow:var(--raise);transform:translateX(2px)}
/* The left edge carries the bug type's colour, so a list is scannable by hue before it is
   read. Set per-row from the tag colour rather than hardcoded here. */
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:0 3px 3px 0;background:var(--row-accent,var(--line))}
.row .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row .ttl{font-weight:550;font-size:14px}
.row .meta{color:var(--dim);font-size:12.5px;margin-top:4px}
.row .meta a{word-break:break-all}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;
  text-transform:uppercase;white-space:nowrap}
.t-breaking_change{color:var(--breaking);background:var(--breaking-bg)}
.t-security{color:var(--security);background:var(--security-bg)}
.t-deprecation{color:var(--deprecation);background:var(--deprecation-bg)}
.t-functional,.t-performance,.t-compatibility,.t-build{color:var(--functional);background:var(--functional-bg)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;
  padding:30px 20px;text-align:center;color:var(--dim);font-size:14px}
.empty b{display:block;color:var(--fg);font-weight:550;margin-bottom:5px}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;width:auto}
.bar select,.bar button{width:auto}
.bar button{padding:9px 16px}
textarea{width:100%;font:13px ui-monospace,Menlo,monospace;padding:11px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--fg);min-height:130px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);
  padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
/* In flow, beside Sign in — not fixed. A fixed control in the corner covered whatever the
   page put there, twice: Sign out in the console header, then Sign in on the landing page. */
.themepick{position:relative}
.themebtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;
  font:inherit;font-size:13px;transition:color .12s ease,border-color .12s ease}
.themebtn:hover{color:var(--fg);border-color:var(--accent)}
.themebtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.themebtn .chev{width:11px;height:11px;opacity:.6}
.thememenu{position:absolute;right:0;top:calc(100% + 6px);min-width:146px;padding:5px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel);
  box-shadow:var(--raise-lg);z-index:70}
.thememenu[hidden]{display:none}
.thememenu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;
  border-radius:7px;background:transparent;color:var(--fg);font:inherit;font-size:13.2px;
  cursor:pointer;text-align:left}
.thememenu button:hover{background:var(--accent-soft)}
.thememenu button[aria-current=true]{color:var(--accent);font-weight:600}
.thememenu svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.subnav{display:flex;gap:2px;margin:-4px 0 18px;border-bottom:1px solid var(--line);
  background:none;padding:0;overflow-x:auto}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px 9px;
  color:var(--dim);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.subnav button[aria-current=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:550}
.settings-body h3{font-size:14px;font-weight:600;margin:20px 0 8px}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter span.over{background:var(--security)}
.tag{font-weight:600;letter-spacing:.01em}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
thead th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--faint);padding:0 12px 8px;white-space:nowrap}
tbody tr{background:var(--panel)}
tbody tr:hover{background:var(--accent-soft)}
tbody td{padding:11px 12px;border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:0}
tbody tr td:first-child{border-radius:8px 0 0 8px}
tbody tr td:last-child{border-radius:0 8px 8px 0}
h2{font-size:19px;letter-spacing:-.015em;font-weight:650;margin-bottom:3px}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:18px;max-width:70ch;line-height:1.55}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 22px;text-align:center;
  color:var(--dim);font-size:13.5px;background:var(--panel)}
.empty b{color:var(--fg)}
/* Skeleton shimmer while a view loads. A spinner says "busy"; this says "content, shortly" —
   and it keeps the layout from jumping when the data lands. */
.skel{height:56px;border-radius:12px;margin-bottom:10px;
  background:linear-gradient(90deg,var(--panel) 25%,var(--line) 37%,var(--panel) 63%);
  background-size:400% 100%}
@media(prefers-reduced-motion:no-preference){
  .skel{animation:shimmer 1.3s ease-in-out infinite}
  @keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
}
/* ---------- landing: one scrolling page, anchored nav ---------- */
.land{min-height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:40;padding:14px clamp(18px,4vw,44px);
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:saturate(1.5) blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px}
.topbar .spacer{margin-left:auto}
.navtabs{display:flex;gap:1px;margin-left:22px}
.navtabs a{padding:7px 12px;border-radius:8px;color:var(--dim);font-size:13.5px;
  text-decoration:none;transition:color .12s ease,background .12s ease}
.navtabs a:hover{color:var(--fg);background:var(--accent-soft)}
.navtabs{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.navtabs::-webkit-scrollbar{display:none}
@media(max-width:820px){
  .navtabs{margin-left:0;order:3;flex-basis:100%;padding-top:4px;gap:0}
  .navtabs a{padding:7px 10px;font-size:13px}
  .topbar-inner{flex-wrap:wrap;row-gap:2px}
  .topbar .spacer{display:none}
  .mark h1{font-size:17px}
}

section{padding:clamp(52px,7vw,92px) clamp(18px,4vw,44px);scroll-margin-top:64px}
section.alt{background:var(--panel);border-block:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto}
.center{text-align:center}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent-dim);margin-bottom:12px}
h2.sec{font-size:clamp(23px,3vw,33px);line-height:1.15;letter-spacing:-.026em;font-weight:680;
  margin-bottom:10px}
p.secsub{color:var(--dim);font-size:15.5px;line-height:1.6;max-width:62ch;margin-bottom:8px}
.center p.secsub{margin-inline:auto}

/* hero */
.hero-sec{padding-top:clamp(56px,9vw,110px);padding-bottom:clamp(40px,5vw,64px);text-align:center;
  position:relative;overflow:hidden}
h1.hero{font-size:clamp(33px,5.6vw,60px);line-height:1.04;letter-spacing:-.035em;font-weight:700;
  margin-bottom:18px}
h1.hero em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--accent-dim) 62%,var(--breaking));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:clamp(15px,1.6vw,18.5px);color:var(--dim);line-height:1.55;max-width:60ch;
  margin:0 auto 30px}
.ctas{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-bottom:44px}
.ctas .btn{width:auto;padding:12px 24px;font-size:15px}
.figures{display:flex;gap:clamp(26px,6vw,64px);justify-content:center;flex-wrap:wrap;
  padding-top:34px;border-top:1px solid var(--line);max-width:760px;margin:0 auto}
.fig .v{font-size:clamp(24px,3vw,32px);font-weight:680;letter-spacing:-.024em;
  font-variant-numeric:tabular-nums;line-height:1.05}
.fig .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
  margin-top:5px;font-weight:600}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;
  border-radius:999px;border:1px solid var(--line);background:var(--accent-soft);
  color:var(--accent-dim);font-size:12px;font-weight:600;margin-bottom:20px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
@media(prefers-reduced-motion:no-preference){
  .eyebrow .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
}

/* search */
.bigsearch{position:relative;max-width:640px;margin:22px auto 12px}
.bigsearch input{width:100%;height:58px;padding:0 110px 0 50px;font-size:16px;border-radius:13px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);box-shadow:var(--raise)}
.bigsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.bigsearch .mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;
  height:18px;color:var(--faint);pointer-events:none}
.bigsearch .go{position:absolute;right:7px;top:7px;height:44px;padding:0 19px;border-radius:10px;
  border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;
  font-size:14.5px;cursor:pointer}
.bigsearch .go:hover{filter:brightness(1.08)}
/* Examples live in a dropdown under the search rather than a grid beside it. The cards pushed
   the input up the page and made the browsing, not the searching, the main thing. */
.exwrap{position:relative;max-width:640px;margin:0 auto 8px;display:flex;justify-content:center}
.extrigger{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;
  font-size:12.5px;cursor:pointer;transition:border-color .12s ease,color .12s ease}
.extrigger:hover{border-color:var(--accent);color:var(--accent)}
.extrigger svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;
  transition:transform .16s ease}
.extrigger[aria-expanded=true] svg{transform:rotate(180deg)}
.expanel{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  width:min(640px,92vw);max-height:min(420px,60vh);overflow-y:auto;z-index:40;text-align:left;
  border:1px solid var(--line);border-radius:13px;background:var(--panel);
  box-shadow:var(--raise-lg);padding:6px}
.expanel[hidden]{display:none}
@media(prefers-reduced-motion:no-preference){
  .expanel{animation:rise .18s cubic-bezier(.16,1,.3,1) both}
}
.exgroup{padding:8px 10px 10px}
.exgroup + .exgroup{border-top:1px solid var(--line)}
.exgroup h4{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  font-weight:700;margin-bottom:7px}
.exgroup .row{display:flex;flex-wrap:wrap;gap:5px}
.ex{display:inline-flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:7px;
  border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;
  font-size:12.5px;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.ex:hover{border-color:var(--accent);background:var(--accent-soft)}
.ex .n{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ex:hover .n{color:var(--accent-dim)}
.exhint{font-size:11.5px;color:var(--faint);padding:8px 10px 4px;border-top:1px solid var(--line)}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:12.5px;font-family:inherit;cursor:pointer}

<script>
const THEME_KEY='bugmine.theme';
const T_ICON={
  light:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>`,
  system:`<svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7"/></svg>`,
  dark:`<svg viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/></svg>`,
};
const T_LABEL={light:'Light',system:'System',dark:'Dark'};
const CHEV=`<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`;

function themeChoice(){
  let saved='system';
  try{ saved=localStorage.getItem(THEME_KEY)||'system'; }catch{}
  return ['light','dark','system'].includes(saved) ? saved : 'system';
}

function applyTheme(choice){
  const root=document.documentElement;
  // "system" is the absence of the attribute, so the media query governs and the page follows
  // the OS live — including a change made while the tab is open.
  if(choice==='system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme',choice);
  try{ localStorage.setItem(THEME_KEY,choice); }catch{}
}

/* Markup for the picker. Rendered into whichever bar is on screen rather than fixed to the
   viewport: a fixed control in the corner covered whatever the page put there — Sign out in the
   console header, then Sign in on the landing page — and reserving space for it was a patch
   that had to be repeated for every new bar. */
function themeControl(){
  const c=themeChoice();
  return `<div class="themepick">
    <button class="themebtn" id="theme-btn" aria-haspopup="true" aria-expanded="false">
      ${T_ICON[c]}<span>${T_LABEL[c]}</span>${CHEV}</button>
    <div class="thememenu" id="theme-menu" hidden>
      ${['light','dark','system'].map(k=>
        `<button data-t="${k}" aria-current="${c===k}">${T_ICON[k]}${T_LABEL[k]}</button>`).join('')}
    </div></div>`;
}

function wireTheme(scope){
  const btn=(scope||document).querySelector('#theme-btn');
  const menu=(scope||document).querySelector('#theme-menu');
  if(!btn||!menu) return;
  const close=()=>{menu.hidden=true;btn.setAttribute('aria-expanded','false');};
  btn.onclick=e=>{
    e.stopPropagation();
    menu.hidden=!menu.hidden;
    btn.setAttribute('aria-expanded',String(!menu.hidden));
  };
  menu.querySelectorAll('button').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    applyTheme(b.dataset.t);
    close();
    // Re-render the control so the button reflects the new choice.
    const host=btn.closest('.themepick');
    host.outerHTML=themeControl();
    wireTheme(scope);
  });
  document.addEventListener('click',close);
}

// Applied before first paint so the page does not flash the wrong theme.
applyTheme(themeChoice());

const LOGO = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"

  <path d="M17.1 11 20.1 9.7M17.3 14.2 20.3 15M16.4 17 18.4 19.1" opacity=".55"/>

  <circle cx="12" cy="6.8" r="2.3"/>

  <circle cx="12" cy="11.6" r="1.15" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="15.4" r="1.15" fill="currentColor" stroke="none"/></svg>`;

const KEY='bugmine.key', TOK='bugmine.idtoken', app=document.getElementById('app');
/* The browser key identifies the Firebase project to its own API. It is not a secret: it is
   visible in any client that signs in, and Identity Platform treats it as a project selector
   rather than a credential. */
const FB_KEY='__FIREBASE_BROWSER_KEY__';
let S={tab:'catalog', settings:'usage', usageDays:30, me:null, summary:null};

const SKELETON='<div class="skel"></div><div class="skel" style="width:82%"></div>'
  +'<div class="skel" style="width:64%"></div>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=t=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'never';
const key=()=>localStorage.getItem(KEY)||'';
const idToken=()=>localStorage.getItem(TOK)||'';
const signedIn=()=>!!(key()||idToken());
function clearCreds(){try{localStorage.removeItem(KEY);localStorage.removeItem(TOK);}catch{}}

async function api(path,opts={}){
  /* X-BugMine-Auth rather than Authorization: the gateway replaces Authorization with its own
     service token, so a Firebase token sent there never arrives. */
  const cred = idToken() ? {'X-BugMine-Auth':idToken()} : {'X-BugMine-Key':key()};
  const r=await fetch(path,{...opts,headers:{...cred,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){clearCreds();signin('Your session ended. Sign in again.');throw new Error('401');}
  if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b?.detail?.error?.message||`Request failed (${r.status})`);}
  return r.status===204?null:r.json();
}

    <section class="hero-sec" id="top">

    <section class="alt" id="why">
      <div class="wrap center">
        <div class="kicker">Why this exists</div>

<div class="args">

            <h3>AI-written code is a new defect class</h3>
            <span class="big">19.7%</span>
            <span class="cap">of AI-suggested packages do not exist, across a 576,000-sample
              study. Open-source models average 21.7%; the worst measured exceed 33%.</span>
            <p>The finding that turns this from a quality problem into a supply-chain attack:
              re-running identical prompts ten times, <em>43% of hallucinated package names
              reappeared every time</em>. Stable hallucinations are predictable, and predictable
              names are registrable by somebody else.</p>
          </div>

          <div class="arg">
            <h3>Volume decouples from review</h3>
            <p>Generated code grows faster than the capacity to review it. The number of changes
              a team ships per reviewer-hour keeps rising, and the reviewing does not scale with
              it — so more defects arrive through a channel nobody reads closely.</p>
            <p>Agents add failure modes nothing catalogs at all: a tool call that silently
              changes behaviour has no advisory, no CVE and no changelog entry.</p>
          </div>

          <div class="arg">
            <h3>Regulation pulls the wrong way</h3>
            <p>Compliance regimes push toward <em>inventory</em> — prove you know what is in
              your software — and inventory is exactly the thing that produces a 92% false
              positive rate. Knowing a package is present is not knowing you are affected.</p>
            <p>The pressure is therefore toward more alerts, not fewer, and the gap between what
              is reported and what matters keeps widening.</p>
          </div>
        </div>

        <div class="against">
          <h3>What argues against all of this</h3>
          <p>Included because an argument that only presents one side is worth less than nothing.</p>
          <ul>
            <li><b>Reachability is being commoditised.</b> Endor Labs, Snyk and Semgrep all ship
              it and market it on exactly this alert-fatigue argument. The 92% figure is a known
              problem under active attack by funded incumbents. BugMine is not first.</li>
            <li><b>The raw material is free.</b> NVD, OSV and GitHub Advisory are public.
              Aggregation is not defensible — what BugMine adds has to be the reachability, the
              non-security bug classes and original discovery, not the collecting.</li>
            <li><b>Eval platforms already exist.</b> Langfuse, LangSmith, Braintrust and Arize
              are established. The distinction is real but narrow: they evaluate <em>your
              application</em>, one customer at a time. None maintains a shared, versioned
              catalog of model behaviour.</li>
          </ul>
        </div>
      </div>

    const trigger = document.getElementById('extrigger');
    if(!panel || !trigger) return;

    let shown = 0;
    const html = EXAMPLES.map(([title, refs])=>{
      // Only offer an example that actually returns something. One that comes back empty
      // teaches a visitor the catalog is thin, when it is the suggestion that went stale.
      const live = refs.filter(r=>counts[r]);
      shown += live.length;
      if(!live.length) return '';
      return `<div class="exgroup"><h4>${esc(title)}</h4><div class="row">

      </div></div>`;
    }).join('');
    panel.innerHTML = html +
      `<div class="exhint">${shown} of ${rows.length.toLocaleString()} covered components —
       or type any other.</div>`;

    const close = () => { panel.hidden = true; trigger.setAttribute('aria-expanded','false'); };
    trigger.onclick = e => {
      e.stopPropagation();
      panel.hidden = !panel.hidden;
      trigger.setAttribute('aria-expanded', String(!panel.hidden));
    };
    panel.onclick = e => e.stopPropagation();
    // Click-outside and Escape both close it. A panel that traps you is worse than no panel.
    document.addEventListener('click', close);
    document.addEventListener('keydown', e => { if(e.key === 'Escape') close(); });
    panel.querySelectorAll('.ex').forEach(b => b.onclick = () => {

          INVALID_LOGIN_CREDENTIALS:'Those details were not accepted.',

         })[body?.error?.message?.split(' ')[0]] || 'Sign-in failed.');

  async sources(){
    const rows=await api('/v1/sources');
    return `<h2>Sources</h2><div class="sub">Crawled on their own schedule. Staleness means no
      successful run in several intervals — a dead source produces no errors at all.</div>
      <div class="bar">
        <input id="url" placeholder="https://api.github.com/repos/…/releases">
        <input id="ref" placeholder="component" style="max-width:180px">
        <button class="btn" id="add">Add</button></div>
      ${rows.length?rows.map(s=>`<div class="row"><div class="top">
        <span class="ttl">${esc(s.component_ref||s.url)}</span>
        ${s.stale?'<span class="pill warn">stale</span>':s.enabled?'<span class="pill ok">healthy</span>':'<span class="pill">disabled</span>'}
        <span class="pill">every ${s.interval_minutes}m</span></div>
        <div class="meta mono">${esc(s.url)}</div>
        <div class="meta">last success ${when(s.last_success_at)}${s.consecutive_failures?` · ${s.consecutive_failures} consecutive failures`:''}</div>
      </div>`).join(''):`<div class="empty"><b>No sources yet</b>Add a releases feed above and the
        scheduler will crawl it within 15 minutes.</div>`}`;
  },
  async team(){
    const rows=await api('/v1/tenant/members');
    return `<h2>Team</h2><div class="sub">Members join by invitation — there is no self-serve signup.</div>
      <div class="tablewrap"><table><thead><tr><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody>
      ${rows.map(m=>`<tr><td>${esc(m.email)}</td><td><span class="pill">${esc(m.role)}</span></td>
        <td style="color:var(--dim)">${when(m.joined_at)}</td></tr>`).join('')}</tbody></table></div>`;
  },
  async settings(){
    const sub = Object.entries(SETTINGS).map(([k,l])=>
      `<button data-s="${k}" aria-current="${S.settings===k}">${l}</button>`).join('');
    const body = await VIEWS[S.settings]();
    return `<nav class="subnav">${sub}</nav><div class="settings-body">${body}</div>`;
  },
  async usage(){
    const u=await api(`/v1/usage?days=${S.usageDays}`);
    const money=m=>'$'+(m/1_000_000).toFixed(4);
    const num=n=>n.toLocaleString();
    const table=(title,rows,note)=>rows.length?`<h3>${title}</h3>
      <div class="tablewrap"><table><thead><tr><th>${title}</th><th>Purpose</th><th>Input</th><th>Output</th>
        <th>Calls</th><th>Failed</th><th>Cost</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.label)}</td><td><span class="pill">${esc(r.purpose)}</span></td>
        <td class="mono">${num(r.input_tokens)}</td><td class="mono">${num(r.output_tokens)}</td>
        <td class="mono">${num(r.calls)}</td>
        <td class="mono">${r.failed_calls?`<span class="pill warn">${r.failed_calls}</span>`:'—'}</td>
        <td class="mono">${money(r.cost_micros)}</td></tr>`).join('')}</tbody></table></div>`
      :`<h3>${title}</h3><div class="sub">${note}</div>`;
    return `<h2>Usage</h2><div class="sub">Your tenant's own spend. System spend — crawling the
      world so the catalog exists — is not billed to you and is not shown.</div>
      <div class="bar"><select id="days">
        ${[7,30,90,365].map(d=>`<option value="${d}" ${S.usageDays==d?'selected':''}>Last ${d} days</option>`).join('')}
      </select></div>
      <div class="stats">
        <div class="stat"><div class="n">${num(u.input_tokens)}</div><div class="l">input tokens</div></div>
        <div class="stat"><div class="n">${num(u.output_tokens)}</div><div class="l">output tokens</div></div>
        <div class="stat"><div class="n">${money(u.cost_micros)}</div><div class="l">cost</div></div>
      </div>
      ${table('Purpose',u.by_purpose,'Nothing spent in this window.')}
      ${table('Team',u.by_team,'No team-attributed spend yet.')}
      ${table('User',u.by_user,'No user-attributed spend yet.')}`;
  },
  async quotas(){
    const rows=await api('/v1/quotas');
    const money=m=>m==null?'—':'$'+(m/1_000_000).toFixed(2);
    const bar=r=>{
      if(r.limit_micros==null) return '';
      const pct=Math.min(100,Math.round(100*r.spent_micros/Math.max(1,r.limit_micros)));
      return `<div class="meter"><span style="width:${pct}%" class="${pct>=100?'over':''}"></span></div>`;
    };
    return `<h2>Quotas</h2><div class="sub">Monthly spending limits, per calendar month. Distinct
      from a job's own ceiling, which stops one runaway extraction — this bounds the bill.
      The most specific limit applies: a user's, else their team's, else everyone's.</div>
      ${rows.length?`<div class="tablewrap"><table><thead><tr><th>Applies to</th><th>Scope</th><th>Spent</th>
        <th>Limit</th><th></th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.label)}</td><td><span class="pill">${esc(r.scope)}</span></td>
          <td class="mono">${money(r.spent_micros)}</td><td class="mono">${money(r.limit_micros)}</td>
          <td style="width:160px">${bar(r)}</td></tr>`).join('')}</tbody></table></div>`
        :`<div class="empty"><b>No limits set</b>Spending is unbounded. A limit here caps what
          can be owed in a month.</div>`}
      <div class="bar" style="margin-top:14px">
        <input id="qlimit" type="number" min="0" step="1" placeholder="Limit in dollars, e.g. 25">
        <button class="btn" id="qset">Set the tenant limit</button>
      </div>`;
  },
  async keys(){
    const rows=await api('/v1/tenant/api-keys');
    return `<h2>API keys</h2><div class="sub">For the CLI, MCP server and CI. Secrets are shown once
      at creation and stored only as hashes — they cannot be recovered.</div>
      <div class="tablewrap"><table><thead><tr><th>Prefix</th><th>Name</th><th>Bound to</th><th>Created</th><th></th></tr></thead><tbody>
      ${rows.map(k=>`<tr><td class="mono">${esc(k.prefix)}…</td><td>${esc(k.name)}</td>
        <td><span class="pill">${esc(k.principal_kind)}</span></td>
        <td style="color:var(--dim)">${when(k.created_at)}</td>
        <td>${k.revoked?'<span class="pill warn">revoked</span>':''}</td></tr>`).join('')}</tbody></table></div>`;
  },
};

/* ---------------- interactions ---------------- */
async function search(){
  const q=document.getElementById('q').value.trim(), bt=document.getElementById('bt').value;
  const res=document.getElementById('res');
  res.innerHTML='<div class="sub">Searching…</div>';
  try{
    const p=new URLSearchParams(); if(q)p.set('q',q); if(bt)p.set('bug_type',bt);
    const rows=await api(`/v1/catalog/search?${p}`);
    res.innerHTML=rows.length?rows.map(bugRow).join('')
      :`<div class="empty"><b>Nothing found</b>${q?`No records for “${esc(q)}”. That means the catalog
        has no coverage here — not that the component is healthy.`:'The catalog is empty.'}</div>`;
  }catch(e){res.innerHTML=`<p class="error">${esc(e.message)}</p>`;}
}

async function check(){
  const eco=document.getElementById('eco').value, out=document.getElementById('dep-results');
  const deps=document.getElementById('deps').value.split('\n').map(l=>l.trim()).filter(Boolean)
    .map(l=>{const m=l.match(/^([A-Za-z0-9@._\/-]+?)\s*(?:==|@|\s)\s*v?([0-9][^\s]*)$/);
      return m?{ecosystem:eco,name:m[1],version:m[2]}:{ecosystem:eco,name:l,version:null};});
  if(!deps.length){out.innerHTML='<div class="empty"><b>Nothing to check</b>Paste some dependencies above.</div>';return;}
  out.innerHTML='<div class="sub">Checking…</div>';
  try{
    const r=await api('/v1/check/dependencies',{method:'POST',body:JSON.stringify({dependencies:deps})});
    const m=r.matches.map(x=>`<div class="row"><div class="top">
        <span class="tag t-${esc(x.bug_type)}">${esc(x.bug_type.replace(/_/g,' '))}</span>
        <span class="ttl">${esc(x.dependency.name)}@${esc(x.dependency.version||'?')}</span>
        ${x.version_confirmed?'':'<span class="pill warn">version unconfirmed</span>'}</div>
      <div class="meta">${esc(x.title)}</div>
      ${x.citation?.evidence_url?`<div class="meta"><a href="${esc(x.citation.evidence_url)}" target="_blank" rel="noreferrer">${esc(x.citation.evidence_url)}</a></div>`:''}
    </div>`).join('');
    // Coverage is stated, never implied. An empty result over an uncovered component is not a
    // clean bill of health, and a UI that showed only matches would be claiming otherwise.
    const nc=r.not_covered.length?`<div class="empty" style="text-align:left"><b>${r.not_covered.length}
      not covered</b>${r.not_covered.slice(0,12).map(n=>esc(n.name)).join(', ')}${r.not_covered.length>12?', …':''}.
      No coverage is not the same as no problem — treat these as unknown.</div>`:'';
    out.innerHTML=(m||`<div class="empty"><b>No known defects</b>None of the covered dependencies
      match a catalog record.</div>`)+nc;
  }catch(e){out.innerHTML=`<p class="error">${esc(e.message)}</p>`;}
}

function wire(){
  document.getElementById('go')?.addEventListener('click',search);
  document.getElementById('q')?.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
  document.getElementById('run')?.addEventListener('click',check);
  document.getElementById('add')?.addEventListener('click',async()=>{
    const url=document.getElementById('url').value.trim(), ref=document.getElementById('ref').value.trim();
    if(!url)return;
    try{await api('/v1/sources',{method:'POST',body:JSON.stringify({url,component_ref:ref||null,ecosystem:'pypi'})});render();}
    catch(e){alert(e.message);}
  });
}

async function render(){
  if(!key())return signin();
  if(!S.me){try{S.me=await api('/v1/whoami');}catch{return signin();}}
  app.innerHTML=`<header><div class="mark">${LOGO}<h1>BugMine</h1></div>
      <span class="who">${esc(S.me.tenant.name)}</span><span class="spacer"></span>
      ${themeControl()}
      <button class="btn ghost" style="width:auto;padding:6px 12px" id="out">Sign out</button></header>
    <nav>${Object.entries(TABS).map(([k,l])=>
      `<button data-t="${k}" aria-current="${S.tab===k}">${l}</button>`).join('')}</nav>
    <main id="body">${SKELETON}</main>`;
  wireTheme();
  document.getElementById('out').onclick=()=>{clearCreds();S.me=null;signin();};
  app.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();});
  const body=document.getElementById('body');
  try{
    body.innerHTML=await VIEWS[S.tab]();
    wire();
    if(S.tab==='catalog')search();
    body.querySelectorAll('.subnav button').forEach(b=>b.onclick=()=>{S.settings=b.dataset.s;render();});
    const days=document.getElementById('days');
    if(days)days.onchange=()=>{S.usageDays=Number(days.value);render();};
    const qset=document.getElementById('qset');
    if(qset)qset.onclick=async()=>{
      const dollars=Number(document.getElementById('qlimit').value);
      if(!Number.isFinite(dollars)||dollars<0)return;
      /* Entered in dollars, stored in micros: a limit typed as 25 must not become 25 millionths
         of a dollar because the wire unit leaked into the form. */
      try{await api('/v1/quotas',{method:'PUT',body:JSON.stringify({limit_micros:Math.round(dollars*1_000_000)})});render();}
      catch(e){alert(e.message);}
    };
  }
  catch(e){body.innerHTML=`<p class="error">${esc(e.message)}</p>`;}
}
render();
</script>
