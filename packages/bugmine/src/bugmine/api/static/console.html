<!doctype html>
<meta charset="utf-8">
<title>BugMine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#fff;--fg:#111;--dim:#666;--line:#e3e3e3;--accent:#1a4d8f;--warn:#8a4b00;--bad:#a11}
  @media(prefers-color-scheme:dark){:root{--bg:#131316;--fg:#e8e8ea;--dim:#9a9aa2;--line:#2c2c32;--accent:#7aa8e0;--warn:#d79a4a;--bad:#e0736b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
  header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:16px;align-items:baseline}
  header b{font-size:17px;letter-spacing:-.01em}
  header .who{margin-left:auto;color:var(--dim);font-size:13px}
  nav{display:flex;gap:4px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;
    color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
  nav button[aria-current=true]{color:var(--fg);border-color:var(--line);background:color-mix(in srgb,var(--fg) 5%,transparent)}
  main{padding:20px;max-width:1000px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{text-align:left;font-weight:600;color:var(--dim);font-size:12px;text-transform:uppercase;
    letter-spacing:.04em;padding:0 12px 8px 0;border-bottom:1px solid var(--line)}
  td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .muted{color:var(--dim)}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
    border:1px solid var(--line);color:var(--dim)}
  .stale{color:var(--warn);border-color:currentColor}
  .err{color:var(--bad)}
  form{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--fg);min-width:220px}
  button.go{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;cursor:pointer}
  .login{max-width:440px;margin:70px auto;padding:0 20px}
  .login p{color:var(--dim);font-size:14px}
  .empty{color:var(--dim);padding:24px 0}
</style>

<div id="app"></div>

<script>
// The console authenticates with an API key rather than a browser sign-in.
//
// There is no OIDC yet, so there is nothing to establish a browser identity against. Pasting a
// key minted by `bugmine-admin` is honest about that: it is a real credential with a real
// principal behind it, not a placeholder session. When OIDC lands this screen is what it
// replaces.
//
// The key goes on X-BugMine-Key, not Authorization, because Cloud Run consumes Authorization
// for its own IAM check on this deployment.
const KEY = 'bugmine.key';
const app = document.getElementById('app');
let state = { tab: 'sources', tenant: null, error: null };

const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-BugMine-Key': localStorage.getItem(KEY) || '', 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (r.status === 401) { localStorage.removeItem(KEY); render(); throw new Error('unauthenticated'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({})))?.detail?.error?.message || `HTTP ${r.status}`);
  return r.status === 204 ? null : r.json();
};

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = (t) => t ? new Date(t).toLocaleString() : '—';

function login(msg) {
  app.innerHTML = `<div class="login">
    <h1>BugMine</h1>
    <p>Sign in with an API key. Create one with
       <code>bugmine-admin key mint</code>.</p>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <form id="f"><input id="k" type="password" placeholder="bmk_…" autofocus>
      <button class="go">Continue</button></form>
  </div>`;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    localStorage.setItem(KEY, document.getElementById('k').value.trim());
    try { state.tenant = await api('/v1/whoami'); render(); }
    catch { localStorage.removeItem(KEY); login('That key was not accepted.'); }
  };
}

const TABS = { sources: 'Sources', members: 'Members', keys: 'API keys' };

async function render() {
  if (!localStorage.getItem(KEY)) return login();
  if (!state.tenant) {
    try { state.tenant = await api('/v1/whoami'); }
    catch { return login(); }
  }
  const t = state.tenant;
  app.innerHTML = `
    <header><b>BugMine</b>
      <span class="muted">${esc(t.tenant.name)}</span>
      <span class="who">${esc(t.principal_kind)} key</span></header>
    <nav>${Object.entries(TABS).map(([k, label]) =>
      `<button data-t="${k}" aria-current="${state.tab === k}">${label}</button>`).join('')}
      <button data-t="_out" style="margin-left:auto">Sign out</button></nav>
    <main id="body"><p class="muted">Loading…</p></main>`;

  app.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
    if (b.dataset.t === '_out') { localStorage.removeItem(KEY); state.tenant = null; return render(); }
    state.tab = b.dataset.t; render();
  });

  const body = document.getElementById('body');
  try { body.innerHTML = await VIEWS[state.tab](); wire(body); }
  catch (e) { body.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

const table = (cols, rows, empty) => rows.length
  ? `<table><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead>
     <tbody>${rows.join('')}</tbody></table>`
  : `<p class="empty">${empty}</p>`;

const VIEWS = {
  async sources() {
    const rows = await api('/v1/sources');
    return `<form id="add">
        <input name="url" placeholder="https://api.github.com/repos/…/releases" required>
        <input name="component_ref" placeholder="component (e.g. pydantic)">
        <input name="ecosystem" placeholder="pypi" style="min-width:110px">
        <button class="go">Add source</button>
      </form>` +
      table(['URL', 'Component', 'Every', 'Last success', 'State'],
        rows.map((s) => `<tr>
          <td><code>${esc(s.url)}</code></td>
          <td>${esc(s.component_ref || '—')} <span class="muted">${esc(s.ecosystem || '')}</span></td>
          <td class="muted">${s.interval_minutes}m</td>
          <td class="muted">${when(s.last_success_at)}</td>
          <td>${s.stale ? '<span class="tag stale">stale</span>'
                        : s.enabled ? '<span class="tag">ok</span>' : '<span class="tag">off</span>'}
              ${s.consecutive_failures ? `<span class="err">${s.consecutive_failures} fail</span>` : ''}</td>
        </tr>`),
        'No sources yet. Add one above — it will be crawled on the interval you set.');
  },
  async members() {
    const rows = await api('/v1/tenant/members');
    return table(['Email', 'Role', 'Joined'],
      rows.map((m) => `<tr><td>${esc(m.email)}</td>
        <td><span class="tag">${esc(m.role)}</span></td>
        <td class="muted">${when(m.joined_at)}</td></tr>`),
      'No members. Invites may be outstanding — issue one with <code>bugmine-admin invite create</code>.');
  },
  async keys() {
    const rows = await api('/v1/tenant/api-keys');
    return `<p class="muted">Secrets are shown once at creation and never stored. Mint with
      <code>bugmine-admin key mint</code>.</p>` +
      table(['Prefix', 'Name', 'Bound to', 'Created', ''],
        rows.map((k) => `<tr><td><code>${esc(k.prefix)}…</code></td>
          <td>${esc(k.name)}</td>
          <td><span class="tag">${esc(k.principal_kind)}</span></td>
          <td class="muted">${when(k.created_at)}</td>
          <td>${k.revoked ? '<span class="err">revoked</span>' : ''}</td></tr>`),
        'No API keys.');
  },
};

function wire(body) {
  const f = body.querySelector('#add');
  if (!f) return;
  f.onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    try {
      await api('/v1/sources', { method: 'POST', body: JSON.stringify({
        url: d.url, component_ref: d.component_ref || null, ecosystem: d.ecosystem || null }) });
      render();
    } catch (err) { alert(err.message); }
  };
}

render();
</script>
