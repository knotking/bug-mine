<!doctype html>
<meta charset="utf-8">
<title>BugMine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  color-scheme:light;
  --bg:#fbfbfd; --panel:#fff; --fg:#16161a; --dim:#6b6b76; --faint:#9a9aa4;
  --line:#e6e6ec; --accent:#4338ca; --accent-fg:#fff;
  --accent-soft:#eef0fe; --accent-dim:#6366f1; --glow:rgba(67,56,202,.18);
  --raise:0 1px 2px rgba(16,16,26,.05), 0 4px 16px rgba(16,16,26,.05);
  --raise-lg:0 2px 4px rgba(16,16,26,.06), 0 12px 40px rgba(16,16,26,.10);
  --grid:rgba(16,16,26,.045);
  --breaking:#8a3d00; --breaking-bg:#fdf1e7;
  --security:#9b1c2b; --security-bg:#fdeef0;
  --deprecation:#5b4b8a; --deprecation-bg:#f2effa;
  --functional:#1f5fbf; --functional-bg:#ecf2fc;
  --ok:#1d6b46; --ok-bg:#eaf6ef; --warn:#8a5b00; --warn-bg:#fdf5e3;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f1013; --panel:#17181d; --fg:#e9e9ee; --dim:#9c9caa; --faint:#6e6e7c;
  --line:#26272e; --accent:#818cf8; --accent-fg:#0f1013;
  --accent-soft:#1b1c2e; --accent-dim:#a5b4fc; --glow:rgba(129,140,248,.22);
  --raise:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --raise-lg:0 2px 4px rgba(0,0,0,.45), 0 12px 40px rgba(0,0,0,.45);
  --grid:rgba(255,255,255,.04);
  --breaking:#e0a06a; --breaking-bg:#2a1e14;
  --security:#e88b93; --security-bg:#2a1618;
  --deprecation:#b3a3e0; --deprecation-bg:#1e1a2a;
  --functional:#7fb0f5; --functional-bg:#141c2a;
  --ok:#6fc79b; --ok-bg:#12241a; --warn:#dcae5c; --warn-bg:#251d0e;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1013; --panel:#17181d; --fg:#e9e9ee; --dim:#9c9caa; --faint:#6e6e7c;
  --line:#26272e; --accent:#818cf8; --accent-fg:#0f1013;
  --accent-soft:#1b1c2e; --accent-dim:#a5b4fc; --glow:rgba(129,140,248,.22);
  --raise:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --raise-lg:0 2px 4px rgba(0,0,0,.45), 0 12px 40px rgba(0,0,0,.45);
  --grid:rgba(255,255,255,.04);
  --breaking:#e0a06a; --breaking-bg:#2a1e14;
  --security:#e88b93; --security-bg:#2a1618;
  --deprecation:#b3a3e0; --deprecation-bg:#1e1a2a;
  --functional:#7fb0f5; --functional-bg:#141c2a;
  --ok:#6fc79b; --ok-bg:#12241a; --warn:#dcae5c; --warn-bg:#251d0e;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,.mono{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- sign in ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;
  overflow:hidden}
/* Two soft colour fields behind the card. Cheap — no images, no libraries — and it gives the
   page a sense of depth that a flat panel on a flat background never has. */
.auth::before,.auth::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);
  pointer-events:none;z-index:0}
.auth::before{width:520px;height:520px;top:-160px;left:-120px;
  background:radial-gradient(circle,var(--glow),transparent 68%)}
.auth::after{width:460px;height:460px;bottom:-180px;right:-140px;
  background:radial-gradient(circle,var(--breaking-bg),transparent 70%);opacity:.75}
/* A faint grid, masked so it fades out before the edges rather than stopping abruptly. */
.auth-grid{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 72%);
  mask-image:radial-gradient(ellipse at center,#000 20%,transparent 72%)}
.auth-card{width:100%;max-width:404px;position:relative;z-index:1;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:30px 28px;box-shadow:var(--raise-lg)}
@media(prefers-reduced-motion:no-preference){
  .auth-card{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mark svg{flex:none}
.mark h1{font-size:22px;letter-spacing:-.02em;font-weight:650}
.tagline{color:var(--dim);font-size:14px;margin-bottom:26px;line-height:1.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:.03em;text-transform:uppercase;margin-bottom:5px}
input,select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--fg)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.btn{width:100%;font:inherit;font-weight:550;padding:10px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:450}
.btn{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.06);box-shadow:0 4px 14px var(--glow)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default;filter:none;box-shadow:none}
input,select,textarea{transition:border-color .12s ease,box-shadow .12s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--glow)}
.note{font-size:13px;color:var(--faint);margin-top:14px;line-height:1.5}
.error{color:var(--security);font-size:13px;margin-top:10px}

/* ---------- shell ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 130px 12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(8px)}
header .mark svg{color:var(--accent)}
.who{padding:3px 9px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent-dim);font-weight:550}
header .mark h1{font-size:16px}
header .spacer{margin-left:auto}
header .who{font-size:13px;color:var(--dim)}
nav{display:flex;gap:2px;padding:8px 20px 0;border-bottom:1px solid var(--line);
  background:var(--panel);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;
  color:var(--dim);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button{transition:color .12s ease,border-color .12s ease}
nav button:hover{color:var(--fg)}
nav button[aria-current=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:22px 20px;max-width:1060px}
h2{font-size:15px;font-weight:600;margin-bottom:3px}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;
  position:relative;overflow:hidden;box-shadow:var(--raise);
  transition:transform .14s ease,box-shadow .14s ease}
.stat:hover{transform:translateY(-2px);box-shadow:var(--raise-lg)}
/* A hairline of accent across the top: enough to make a number feel deliberate rather than
   dropped into a box. */
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-dim),transparent)}
.stat .n{font-variant-numeric:tabular-nums}
.stat .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:12px;color:var(--dim);margin-top:3px}

/* ---------- lists ---------- */
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px 14px 17px;margin-bottom:10px;position:relative;
  transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease}
.row:hover{border-color:var(--accent);box-shadow:var(--raise);transform:translateX(2px)}
/* The left edge carries the bug type's colour, so a list is scannable by hue before it is
   read. Set per-row from the tag colour rather than hardcoded here. */
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:0 3px 3px 0;background:var(--row-accent,var(--line))}
.row .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row .ttl{font-weight:550;font-size:14px}
.row .meta{color:var(--dim);font-size:12.5px;margin-top:4px}
.row .meta a{word-break:break-all}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;
  text-transform:uppercase;white-space:nowrap}
.t-breaking_change{color:var(--breaking);background:var(--breaking-bg)}
.t-security{color:var(--security);background:var(--security-bg)}
.t-deprecation{color:var(--deprecation);background:var(--deprecation-bg)}
.t-functional,.t-performance,.t-compatibility,.t-build{color:var(--functional);background:var(--functional-bg)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;
  padding:30px 20px;text-align:center;color:var(--dim);font-size:14px}
.empty b{display:block;color:var(--fg);font-weight:550;margin-bottom:5px}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;width:auto}
.bar select,.bar button{width:auto}
.bar button{padding:9px 16px}
textarea{width:100%;font:13px ui-monospace,Menlo,monospace;padding:11px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--fg);min-height:130px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);
  padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.theme{position:fixed;top:14px;right:16px;z-index:50;display:flex;gap:2px;
  padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.theme button{width:28px;height:28px;padding:0;border:0;border-radius:999px;cursor:pointer;
  background:transparent;color:var(--faint);display:grid;place-items:center;line-height:0}
.theme button:hover{color:var(--fg)}
.theme button[aria-current=true]{background:var(--accent);color:var(--accent-fg)}
.theme svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
@media(max-width:640px){.theme{top:8px;right:8px}header{padding-right:112px}}
.subnav{display:flex;gap:2px;margin:-4px 0 18px;border-bottom:1px solid var(--line);
  background:none;padding:0;overflow-x:auto}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px 9px;
  color:var(--dim);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.subnav button[aria-current=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:550}
.settings-body h3{font-size:14px;font-weight:600;margin:20px 0 8px}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter span.over{background:var(--security)}
.tag{font-weight:600;letter-spacing:.01em}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
thead th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--faint);padding:0 12px 8px;white-space:nowrap}
tbody tr{background:var(--panel)}
tbody tr:hover{background:var(--accent-soft)}
tbody td{padding:11px 12px;border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:0}
tbody tr td:first-child{border-radius:8px 0 0 8px}
tbody tr td:last-child{border-radius:0 8px 8px 0}
h2{font-size:19px;letter-spacing:-.015em;font-weight:650;margin-bottom:3px}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:18px;max-width:70ch;line-height:1.55}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 22px;text-align:center;
  color:var(--dim);font-size:13.5px;background:var(--panel)}
.empty b{color:var(--fg)}
/* Skeleton shimmer while a view loads. A spinner says "busy"; this says "content, shortly" —
   and it keeps the layout from jumping when the data lands. */
.skel{height:56px;border-radius:12px;margin-bottom:10px;
  background:linear-gradient(90deg,var(--panel) 25%,var(--line) 37%,var(--panel) 63%);
  background-size:400% 100%}
@media(prefers-reduced-motion:no-preference){
  .skel{animation:shimmer 1.3s ease-in-out infinite}
  @keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
}
/* ---------- landing: full page, search first ---------- */
.land{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:14px;
  padding:18px clamp(130px,4vw + 112px,150px) 18px clamp(18px,4vw,44px);
  position:relative;z-index:30}
@media(max-width:640px){.topbar{padding-right:112px}}
.topbar .spacer{margin-left:auto}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(20px,4vw,40px) clamp(18px,4vw,44px) 60px;text-align:center;position:relative;
  z-index:1}
.hero-wrap{width:100%;max-width:880px}
h1.hero{font-size:clamp(34px,6.4vw,68px);line-height:1.02;letter-spacing:-.036em;font-weight:700;
  margin-bottom:18px}
h1.hero em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--accent-dim) 60%,var(--breaking));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:clamp(15px,1.7vw,19px);color:var(--dim);line-height:1.55;max-width:60ch;
  margin:0 auto 34px}
/* The search is the product, so it is the largest thing on the page. */
.bigsearch{position:relative;max-width:660px;margin:0 auto 14px}
.bigsearch input{width:100%;height:62px;padding:0 116px 0 52px;font-size:17px;border-radius:14px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);
  box-shadow:var(--raise-lg);transition:border-color .14s ease,box-shadow .14s ease}
.bigsearch input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px var(--glow),var(--raise-lg)}
.bigsearch .mag{position:absolute;left:19px;top:50%;transform:translateY(-50%);width:19px;
  height:19px;color:var(--faint);pointer-events:none}
.bigsearch .go{position:absolute;right:8px;top:8px;height:46px;padding:0 20px;border-radius:10px;
  border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;
  font-size:14.5px;cursor:pointer;transition:filter .12s ease}
.bigsearch .go:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:2px;justify-content:center;margin:0 auto 14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);max-width:760px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px 10px;
  color:var(--dim);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:color .12s ease,border-color .12s ease}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current=true]{color:var(--accent);border-bottom-color:var(--accent);
  font-weight:600}
.tabs .n{font-size:11px;color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-size:12.5px;font-family:inherit;cursor:pointer;
  transition:border-color .12s ease,color .12s ease}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.results{max-width:760px;margin:0 auto;text-align:left;display:grid;gap:8px}
.hit{display:grid;grid-template-columns:128px 132px minmax(0,1fr) 96px;align-items:center;
  gap:12px;padding:12px 15px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);font-size:13.5px;box-shadow:var(--raise);
  animation:rise .32s cubic-bezier(.16,1,.3,1) both}
.hit .tag{justify-self:start}
.hit .c{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .t{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Right-aligned and tabular so versions line up as a column instead of ragging. */
.hit .v{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums;
  text-align:right}
@media(max-width:720px){
  .hit{grid-template-columns:108px minmax(0,1fr);row-gap:4px}
  .hit .t{grid-column:1/-1}
  .hit .v{grid-column:2;text-align:right}
}
.figures{display:flex;gap:clamp(24px,5vw,56px);justify-content:center;flex-wrap:wrap;
  margin-top:44px;padding-top:30px;border-top:1px solid var(--line);max-width:760px;
  margin-inline:auto}
.fig .v{font-size:clamp(24px,3vw,32px);font-weight:680;letter-spacing:-.024em;
  font-variant-numeric:tabular-nums;line-height:1.05}
.fig .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
  margin-top:5px;font-weight:600}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;
  border-radius:999px;border:1px solid var(--line);background:var(--accent-soft);
  color:var(--accent-dim);font-size:12px;font-weight:600;margin-bottom:22px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
@media(prefers-reduced-motion:no-preference){
  .eyebrow .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
}
/* Sign-in lives behind the top-right button and only takes the screen when asked for. */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:22px;
  background:rgba(10,10,16,.55);backdrop-filter:blur(4px)}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:396px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:26px 26px 22px;box-shadow:var(--raise-lg);position:relative}
@media(prefers-reduced-motion:no-preference){
  .sheet-card{animation:rise .28s cubic-bezier(.16,1,.3,1) both}
}
.sheet-x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:8px;
  background:transparent;color:var(--faint);font-size:19px;line-height:1;cursor:pointer}
.sheet-x:hover{background:var(--accent-soft);color:var(--fg)}
</style>

<div class="theme" role="group" aria-label="Colour theme">
  <button data-theme="light" title="Light" aria-label="Light">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></button>
  <button data-theme="system" title="Match system" aria-label="Match system">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7"/></svg></button>
  <button data-theme="dark" title="Dark" aria-label="Dark">
    <svg viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/></svg></button>
</div>
<div id="app"></div>

<script>
const THEME_KEY='bugmine.theme';
function applyTheme(choice){
  const root=document.documentElement;
  if(choice==='system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme',choice);
  try{localStorage.setItem(THEME_KEY,choice);}catch{}
  document.querySelectorAll('.theme button').forEach(b=>
    b.setAttribute('aria-current',String(b.dataset.theme===choice)));
}
(function initTheme(){
  let saved='system';
  try{saved=localStorage.getItem(THEME_KEY)||'system';}catch{}
  if(!['light','dark','system'].includes(saved)) saved='system';
  applyTheme(saved);
  document.querySelectorAll('.theme button').forEach(b=>
    b.addEventListener('click',()=>applyTheme(b.dataset.theme)));
})();

const LOGO = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">

const KEY='bugmine.key', TOK='bugmine.idtoken', app=document.getElementById('app');
/* The browser key identifies the Firebase project to its own API. It is not a secret: it is
   visible in any client that signs in, and Identity Platform treats it as a project selector
   rather than a credential. */
const FB_KEY='__FIREBASE_BROWSER_KEY__';
let S={tab:'catalog', settings:'usage', usageDays:30, me:null, summary:null};

const SKELETON='<div class="skel"></div><div class="skel" style="width:82%"></div>'
  +'<div class="skel" style="width:64%"></div>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=t=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'never';
const key=()=>localStorage.getItem(KEY)||'';
const idToken=()=>localStorage.getItem(TOK)||'';
const signedIn=()=>!!(key()||idToken());
function clearCreds(){try{localStorage.removeItem(KEY);localStorage.removeItem(TOK);}catch{}}

async function api(path,opts={}){
  /* X-BugMine-Auth rather than Authorization: the gateway replaces Authorization with its own
     service token, so a Firebase token sent there never arrives. */
  const cred = idToken() ? {'X-BugMine-Auth':idToken()} : {'X-BugMine-Key':key()};
  const r=await fetch(path,{...opts,headers:{...cred,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){clearCreds();signin('Your session ended. Sign in again.');throw new Error('401');}
  if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b?.detail?.error?.message||`Request failed (${r.status})`);}
  return r.status===204?null:r.json();
}

function signin(msg){
  app.innerHTML=`<div class="land">

          <div class="fig"><div class="v">—</div><div class="k">components</div></div>

        </div>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Sign in">
        <button class="sheet-x" id="sheet-x" aria-label="Close">&times;</button>
        <div class="mark" style="margin-bottom:14px">${LOGO}<h1 style="font-size:18px">Sign in</h1></div>
        <p class="sub" style="margin-bottom:18px">Accounts are created by invitation.</p>
        <form id="f">
          <div class="field"><label for="em">Email</label>
            <input id="em" type="email" autocomplete="username"></div>
          <div class="field"><label for="pw">Password</label>
            <input id="pw" type="password" autocomplete="current-password"></div>
          <button class="btn" id="signin-go">Sign in</button>
        </form>
        <p id="err" class="error" style="${msg?'':'display:none'}">${esc(msg||'')}</p>
        <p class="note"><a href="#" id="usekey">Use an API key instead</a></p>
        <form id="kf" style="display:none;margin-top:12px">
          <div class="field"><label for="k">API key</label>
            <input id="k" type="password" placeholder="bmk_…" autocomplete="off"></div>
          <button class="btn ghost">Use key</button>
        </form>
      </div>
    </div>
  </div>`;

  const sheet=document.getElementById('sheet');
  const openSheet=()=>{sheet.hidden=false;document.getElementById('em').focus();};
  const closeSheet=()=>{sheet.hidden=true;};
  document.getElementById('open-signin').onclick=openSheet;
  document.getElementById('sheet-x').onclick=closeSheet;
  // Click-outside and Escape both close it: a dialog that traps you is worse than no dialog.
  sheet.onclick=e=>{ if(e.target===sheet) closeSheet(); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!sheet.hidden) closeSheet(); });
  if(msg) openSheet();

  const err = m => { const e=document.getElementById('err'); e.textContent=m; e.style.display=''; };

  // Real counts rather than a claim. Public scope only, so nothing here is a tenant's.
  fetch('/v1/public/stats').then(r=>r.json()).then(s=>{
    const n=v=>Number(v||0).toLocaleString();
    document.getElementById('figs').innerHTML=[
      [n(s.records),'records'],[n(s.components),'components'],[n(s.beyond_security),'beyond CVEs'],
    ].map(([v,k])=>`<div class="fig"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
  }).catch(()=>{});

  let hits=[], filter='all', lastQ='';

  const paint=()=>{
    const out=document.getElementById('pout'), tabs=document.getElementById('ptabs');
    const shown = filter==='all' ? hits : hits.filter(b=>b.bug_type===filter);
    const counts = hits.reduce((m,b)=>(m[b.bug_type]=(m[b.bug_type]||0)+1,m),{});
    const order = ['breaking_change','deprecation','security','functional','performance'];

    tabs.hidden = !hits.length;
    tabs.innerHTML = !hits.length ? '' : [['all','Everything',hits.length]]

    out.innerHTML = shown.length ? shown.map(b=>{
      const a=b.applicability||{};
      const v=a.introduced_in?`from ${esc(a.introduced_in)}`
             :(a.fixed_in?`fixed ${esc(a.fixed_in)}`:'—');

  async function demo(q){
    const out=document.getElementById('pout');

    lastQ=q; filter='all';
    out.innerHTML='<div class="skel" style="height:44px"></div>';
    try{
      // Fetched once and filtered here: re-querying per tab would let the counts and the rows
      // disagree whenever a crawl landed between two requests.
      const r=await fetch(`/v1/public/bugs/search?limit=60&q=${encodeURIComponent(q)}`);
      hits=await r.json();
      paint();
    }catch{ hits=[]; out.innerHTML='<p class="error">Search is unavailable right now.</p>'; }
  }
  const qbox=document.getElementById('pq');
  document.getElementById('pgo').onclick=()=>demo(qbox.value.trim());
  qbox.addEventListener('keydown',e=>{ if(e.key==='Enter') demo(e.target.value.trim()); });
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{

  document.getElementById('usekey').onclick=e=>{

      const r=await fetch(
        `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_KEY}`,
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          email:document.getElementById('em').value.trim(),
          password:document.getElementById('pw').value,
          returnSecureToken:true})});
      const body=await r.json();
      if(!r.ok) throw new Error(
        ({EMAIL_NOT_FOUND:'No account for that email.',
          INVALID_PASSWORD:'That password was not accepted.',
          INVALID_LOGIN_CREDENTIALS:'Those details were not accepted.',
          USER_DISABLED:'That account is disabled.',
          TOO_MANY_ATTEMPTS_TRY_LATER:'Too many attempts. Try again shortly.'
         })[body?.error?.message?.split(' ')[0]] || 'Sign-in failed.');
      clearCreds();
      localStorage.setItem(TOK, body.idToken);
      S.me=await api('/v1/whoami');
      render();
    }catch(ex){
      clearCreds();
      err(/no_account|403/.test(String(ex.message)) ?
        'That sign-in worked, but the address has no BugMine account. Ask for an invite.' :
        ex.message);
      btn.disabled=false; btn.textContent='Sign in';
    }
  };

  document.getElementById('kf').onsubmit=async e=>{
    e.preventDefault();
    clearCreds();
    localStorage.setItem(KEY,document.getElementById('k').value.trim());
    try{S.me=await api('/v1/whoami');render();}
    catch{clearCreds();signin('That key was not accepted.');}
  };
}

/* ---------------- interactions ---------------- */
async function search(){
  const q=document.getElementById('q').value.trim(), bt=document.getElementById('bt').value;
  const res=document.getElementById('res');
  res.innerHTML='<div class="sub">Searching…</div>';
  try{
    const p=new URLSearchParams(); if(q)p.set('q',q); if(bt)p.set('bug_type',bt);
    const rows=await api(`/v1/catalog/search?${p}`);
    res.innerHTML=rows.length?rows.map(bugRow).join('')
      :`<div class="empty"><b>Nothing found</b>${q?`No records for “${esc(q)}”. That means the catalog
        has no coverage here — not that the component is healthy.`:'The catalog is empty.'}</div>`;
  }catch(e){res.innerHTML=`<p class="error">${esc(e.message)}</p>`;}
}

async function check(){
  const eco=document.getElementById('eco').value, out=document.getElementById('dep-results');
  const deps=document.getElementById('deps').value.split('\n').map(l=>l.trim()).filter(Boolean)
    .map(l=>{const m=l.match(/^([A-Za-z0-9@._\/-]+?)\s*(?:==|@|\s)\s*v?([0-9][^\s]*)$/);
      return m?{ecosystem:eco,name:m[1],version:m[2]}:{ecosystem:eco,name:l,version:null};});
  if(!deps.length){out.innerHTML='<div class="empty"><b>Nothing to check</b>Paste some dependencies above.</div>';return;}
  out.innerHTML='<div class="sub">Checking…</div>';
  try{
    const r=await api('/v1/check/dependencies',{method:'POST',body:JSON.stringify({dependencies:deps})});
    const m=r.matches.map(x=>`<div class="row"><div class="top">
        <span class="tag t-${esc(x.bug_type)}">${esc(x.bug_type.replace(/_/g,' '))}</span>
        <span class="ttl">${esc(x.dependency.name)}@${esc(x.dependency.version||'?')}</span>
        ${x.version_confirmed?'':'<span class="pill warn">version unconfirmed</span>'}</div>
      <div class="meta">${esc(x.title)}</div>
      ${x.citation?.evidence_url?`<div class="meta"><a href="${esc(x.citation.evidence_url)}" target="_blank" rel="noreferrer">${esc(x.citation.evidence_url)}</a></div>`:''}
    </div>`).join('');
    // Coverage is stated, never implied. An empty result over an uncovered component is not a
    // clean bill of health, and a UI that showed only matches would be claiming otherwise.
    const nc=r.not_covered.length?`<div class="empty" style="text-align:left"><b>${r.not_covered.length}
      not covered</b>${r.not_covered.slice(0,12).map(n=>esc(n.name)).join(', ')}${r.not_covered.length>12?', …':''}.
      No coverage is not the same as no problem — treat these as unknown.</div>`:'';
    out.innerHTML=(m||`<div class="empty"><b>No known defects</b>None of the covered dependencies
      match a catalog record.</div>`)+nc;
  }catch(e){out.innerHTML=`<p class="error">${esc(e.message)}</p>`;}
}

function wire(){
  document.getElementById('go')?.addEventListener('click',search);
  document.getElementById('q')?.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
  document.getElementById('run')?.addEventListener('click',check);
  document.getElementById('add')?.addEventListener('click',async()=>{
    const url=document.getElementById('url').value.trim(), ref=document.getElementById('ref').value.trim();
    if(!url)return;
    try{await api('/v1/sources',{method:'POST',body:JSON.stringify({url,component_ref:ref||null,ecosystem:'pypi'})});render();}
    catch(e){alert(e.message);}
  });
}

  if(!key())return signin();
  if(!S.me){try{S.me=await api('/v1/whoami');}catch{return signin();}}
  app.innerHTML=`<header><div class="mark">${LOGO}<h1>BugMine</h1></div>
      <span class="who">${esc(S.me.tenant.name)}</span><span class="spacer"></span>
      <button class="btn ghost" style="width:auto;padding:6px 12px" id="out">Sign out</button></header>
    <nav>${Object.entries(TABS).map(([k,l])=>
      `<button data-t="${k}" aria-current="${S.tab===k}">${l}</button>`).join('')}</nav>
    <main id="body">${SKELETON}</main>`;
  document.getElementById('out').onclick=()=>{clearCreds();S.me=null;signin();};
  app.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();});
  const body=document.getElementById('body');
  try{
    body.innerHTML=await VIEWS[S.tab]();
    wire();
    if(S.tab==='catalog')search();
    body.querySelectorAll('.subnav button').forEach(b=>b.onclick=()=>{S.settings=b.dataset.s;render();});
    const days=document.getElementById('days');
    if(days)days.onchange=()=>{S.usageDays=Number(days.value);render();};
    const qset=document.getElementById('qset');
    if(qset)qset.onclick=async()=>{
      const dollars=Number(document.getElementById('qlimit').value);
      if(!Number.isFinite(dollars)||dollars<0)return;
      /* Entered in dollars, stored in micros: a limit typed as 25 must not become 25 millionths
         of a dollar because the wire unit leaked into the form. */
      try{await api('/v1/quotas',{method:'PUT',body:JSON.stringify({limit_micros:Math.round(dollars*1_000_000)})});render();}
      catch(e){alert(e.message);}
    };
  }
  catch(e){body.innerHTML=`<p class="error">${esc(e.message)}</p>`;}
}
render();
</script>
