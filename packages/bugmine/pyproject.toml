[project]
name = "bugmine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "packaging>=24.2",
    "structlog>=24.4",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "mcp>=1.2",
    "google-cloud-storage>=2.19",
    "google-cloud-tasks>=2.17",
    "google-genai>=1.0",
]

[project.scripts]
bugmine = "bugmine.cli:main"
bugmine-mcp = "bugmine.mcp_server:main"
bugmine-verify = "bugmine.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugmine"]
