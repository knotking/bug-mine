[project]
name = "bugmine-workspace"
version = "0.1.0"
description = "BugMine — a catalog of what actually breaks"
requires-python = ">=3.12"
dependencies = ["bugmine"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bugmine = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a live database or GCP credentials"]
